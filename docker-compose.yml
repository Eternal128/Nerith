version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nerith_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nerith
      POSTGRES_PASSWORD: nerith_dev
      POSTGRES_DB: nerith
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerith']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
